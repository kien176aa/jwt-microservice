version: '3.7'

services:
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_USER=k6
      - INFLUXDB_PASSWORD=k6
    networks:
      - k6net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"   # đổi từ 3000 -> 3001
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - k6net
    depends_on:
      - influxdb

networks:
  k6net:
    driver: bridge
