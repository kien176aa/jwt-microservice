server:
  port: 8081

spring:
  application:
    name: ORDER-SERVICE
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

url:
  identity:
    service: ${URL_IDENTITY_SERVICE}
  product:
    service: ${URL_PRODUCT_SERVICE}
