apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: java-instrumentation
  namespace: microsvc
spec:
  exporter:
    endpoint: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
  propagators:
  - tracecontext
  - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  java:
    env:
    - name: OTEL_LOG_LEVEL
      value: "info"
    - name: OTEL_INSTRUMENTATION_KAFKA_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_REDIS_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_JDBC_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_JDBC_DATASOURCE_ENABLED
      value: "true"
    - name: OTEL_METRICS_EXPORTER
      value: otlp
    - name: OTEL_INSTRUMENTATION_HTTPCLIENT_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_SPRING_KAFKA_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_DROPWIZARD_METRICS_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_AKKA_ACTOR_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: grpc
