apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microsvc

spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: "true"
        instrumentation.opentelemetry.io/inject-java: "true"
      labels:
        framework: spring
        app: api-gateway

    spec:
      containers:
      - name: api-gateway
        image: datnd2711/microsv-apigw-svc:release-v4
        ports:
        - containerPort: 8080
          name: http-apigw
        env:
        - name: OTEL_SERVICE_NAME
          value: api-gateway
        # - name: JAVA_TOOL_OPTIONS
        #   value: "-javaagent:/otel-auto-instrumentation-java-api-gateway/javaagent.jar"              
        - name: URL_VALIDATE_TOKEN
          value: http://identity-service:9898/auth/validate
        - name: ORDER_SERVICE_URI
          value: http://orders-service:8081
        - name: PRODUCT_SERVICE_URI
          value: http://product-service:8082
        - name: IDENTITY_SERVICE_URI
          value: http://identity-service:9898
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: microsvc

spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: http-apigw
  type: ClusterIP
